# Terminal / colour
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Mouse + scrollback
set -g mouse on
set -g history-limit 50000

# Numbering starts at 1 and stays gapless
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Responsiveness
set -s escape-time 10
set -g focus-events on

# Keep long-running work addressable
set -g display-time 2000
setw -g automatic-rename off
set -g set-titles on
set -g set-titles-string "#S:#W"

# Splits that inherit the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Reload config
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# Vi-style copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Status bar
set -g status-interval 5
set -g status-style "bg=colour236,fg=colour250"
set -g status-left "#[bg=colour31,fg=colour231,bold] #S #[default] "
set -g status-left-length 30
set -g status-right "#(ship-state awaiting-count --tmux 2>/dev/null)#[fg=colour245]#h #[fg=colour250]%H:%M "
setw -g window-status-current-style "bg=colour31,fg=colour231,bold"
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "
set -g pane-active-border-style "fg=colour31"

# Prefix-free window switching (Option-1..5), for terminals that swallow Ctrl-b (cmux, VS Code).
# cmux/iTerm need "Option as Meta" (or "Use Option as Meta key") enabled for these.
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5

# Copy in tmux lands on the local (Mac) clipboard, even over SSH (OSC 52)
set -g set-clipboard on

# Let bells and notifications from panes reach the terminal, so cmux can flag the tab
set -g allow-passthrough all
setw -g monitor-bell on
set -g bell-action any
set -g visual-bell off
